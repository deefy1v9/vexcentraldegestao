# =============================================================================
#  ATENÇÃO — ARQUIVO OBSOLETO. NÃO APLIQUE ESTE STACK EM PRODUÇÃO.
# =============================================================================
#
#  O servidor de produção é COMPARTILHADO com outros projetos e o Traefik que
#  roda lá NÃO veio deste arquivo: é o container 'n8n-traefik-1', da stack do
#  n8n, com providers docker+swarm, rede 'traefik-public' e cert resolver
#  'mytlschallenge'.
#
#  Rodar 'docker stack deploy -c docker-compose.infra.yml infra' subiria um
#  SEGUNDO Traefik disputando as portas 80/443 e derrubaria todos os projetos
#  do servidor, inclusive os que não são nossos.
#
#  Este arquivo fica no repositório apenas como referência histórica de como
#  provisionar um servidor NOVO do zero. Para ajustar o roteamento da Central
#  de Gestão, altere as labels do serviço 'app' em docker-compose.app.yml —
#  nunca esta infraestrutura compartilhada.
# =============================================================================

version: "3.9"

services:
  traefik:
    image: traefik:v3.6
    command:
      - --api.insecure=true
      - --providers.swarm=true
      - --providers.swarm.exposedByDefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Descomente para SSL com domínio:
      # - --entrypoints.web.http.redirections.entryPoint.to=websecure
      # - --entrypoints.web.http.redirections.entryPoint.scheme=https
      # - --certificatesresolvers.letsencrypt.acme.email=seu-email@dominio.com
      # - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - traefik-public
    deploy:
      placement:
        constraints:
          - node.role == manager

  portainer:
    image: portainer/portainer-ce:2.33.0
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - traefik-public
    deploy:
      placement:
        constraints:
          - node.role == manager

volumes:
  traefik-letsencrypt:
  portainer-data:

networks:
  traefik-public:
    external: true
