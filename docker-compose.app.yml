version: "3.9"

services:
  app:
    image: ghcr.io/deefy1v9/vexcentraldegestao:latest
    environment:
      DATABASE_URL: postgresql://vex:${DB_PASSWORD}@db:5432/vex_gestao
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: https://central.vexgrowth.com.br
      NODE_ENV: production
    networks:
      - traefik-public   # <-- ALTERE para o nome da rede do Traefik existente
      - internal
    depends_on:
      - db
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
      labels:
        # Padrão idêntico aos outros projetos que funcionam neste Traefik.
        # O redirect HTTP→HTTPS já é global no Traefik (entrypoints.web.http.redirections).
        - traefik.enable=true
        - traefik.http.routers.vex.entrypoints=websecure
        - traefik.http.routers.vex.rule=Host(`central.vexgrowth.com.br`)
        - traefik.http.routers.vex.tls.certresolver=mytlschallenge
        - traefik.http.services.vex.loadbalancer.server.port=3000
    healthcheck:
      # node:20-slim não tem wget/curl — usa o fetch nativo do Node 20
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/auth/session').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vex
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: vex_gestao
    volumes:
      - vex-postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vex -d vex_gestao"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vex-postgres-data:   # nome único para não conflitar com outros projetos

networks:
  traefik-public:         # <-- ALTERE para o nome da rede do Traefik existente
    external: true
  internal:
    driver: overlay
    name: vex-internal  # nome único para não conflitar
