version: "3.9"

services:
  app:
    image: ghcr.io/deefy1v9/vexcentraldegestao:latest
    environment:
      DATABASE_URL: postgresql://vex:${DB_PASSWORD}@db:5432/vex_gestao
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: https://central.vexgrowth.com.br
      NODE_ENV: production
    volumes:
      # Anexos de demandas sao gravados em disco. Sem este volume, todo
      # anexo enviado desaparecia no deploy seguinte junto com o container.
      - vex-uploads:/app/public/uploads
    networks:
      - traefik-public   # <-- ALTERE para o nome da rede do Traefik existente
      - internal
    depends_on:
      - db
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
      labels:
        # Padrão idêntico aos outros projetos que funcionam neste Traefik.
        # O redirect HTTP→HTTPS já é global no Traefik (entrypoints.web.http.redirections).
        - traefik.enable=true
        - traefik.http.routers.vex.entrypoints=websecure
        - traefik.http.routers.vex.rule=Host(`central.vexgrowth.com.br`)
        - traefik.http.routers.vex.tls.certresolver=mytlschallenge
        - traefik.http.services.vex.loadbalancer.server.port=3000
    # Healthcheck em Node puro: a imagem node:20-slim nao tem wget nem curl,
    # e era isso que fazia o healthcheck antigo falhar, o swarm matar o
    # container e o deploy travar em rollback_paused.
    # /api/health nao consulta o banco — responde assim que o servidor sobe,
    # entao o Traefik so roteia trafego quando o container esta pronto.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vex
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: vex_gestao
    volumes:
      - vex-postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vex -d vex_gestao"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dump diario do Postgres, com retencao de 7 dias. Sem isto nao havia
  # nenhuma copia de seguranca do banco de producao.
  # Restaurar: pg_restore -U vex -d vex_gestao -c /backups/<arquivo>.dump
  db-backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - vex-db-backups:/backups
    networks:
      - internal
    depends_on:
      - db
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          # O swarm ignora depends_on: espera o banco aceitar conexoes, senao
          # o primeiro dump falharia e o proximo so viria 24h depois.
          until pg_isready -h db -U vex -d vex_gestao -q; do
            echo "aguardando o banco..."
            sleep 5
          done
          ts=$$(date +%Y%m%d-%H%M%S)
          if pg_dump -h db -U vex -d vex_gestao -Fc -f /backups/vex_gestao-$$ts.dump; then
            echo "backup ok: vex_gestao-$$ts.dump"
          else
            echo "BACKUP FALHOU em $$ts" >&2
          fi
          find /backups -name '*.dump' -mtime +7 -delete
          sleep 86400
        done
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 30s
      resources:
        limits:
          memory: 128M

volumes:
  vex-db-backups:      # dumps diarios do Postgres
  vex-uploads:         # anexos de demandas (public/uploads)
  vex-postgres-data:   # nome único para não conflitar com outros projetos

networks:
  traefik-public:         # <-- ALTERE para o nome da rede do Traefik existente
    external: true
  internal:
    driver: overlay
    name: vex-internal  # nome único para não conflitar
